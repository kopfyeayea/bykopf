<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopf | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        /* Less subtle, deeper radial gradient */
        body { 
            background: radial-gradient(circle at center, #111111 0%, #050505 50%, #000000 100%);
            margin: 0; 
            overflow: hidden; 
            color: white; 
            font-family: 'Inter', sans-serif; 
        }
        
        .plex-mono { font-family: 'IBM Plex Mono', monospace; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .discord-status {
            width: 12px;
            height: 12px;
            background: #ff73fa;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 15px #ff73fa;
        }

        .reveal {
            animation: revealFade 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes revealFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        .content { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <main class="content h-screen w-full flex flex-col justify-center items-center px-6">
        
        <div class="glass-panel p-8 md:p-12 rounded-[2.5rem] w-full max-w-4xl reveal flex flex-col items-center">
            
            <div class="text-center mb-12 w-full">
                <p class="text-slate-600 plex-mono text-[10px] tracking-[0.6em] uppercase mb-4 opacity-70">A R C H I V E // 2025</p>
                <h1 class="text-8xl md:text-9xl font-black italic uppercase tracking-tighter leading-none text-white/90">KOPF</h1>
            </div>

            <div class="flex flex-col md:flex-row gap-10 w-full items-center justify-between">
                
                <div class="flex items-center gap-5 interactive">
                    <div class="relative">
                        <div class="w-20 h-20 rounded-full bg-zinc-900 border border-white/10 overflow-hidden shadow-2xl">
                            <img src="avatar.png" alt="Avatar" class="w-full h-full object-cover grayscale hover:grayscale-0 transition duration-700">
                        </div>
                        <div class="discord-status absolute bottom-1 right-1 border-4 border-[#0a0a0a]"></div>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-xl text-white">k</span>
                            <span class="text-[10px] px-2 py-0.5 bg-white/10 rounded plex-mono opacity-50">kopf.</span>
                        </div>
                        <div class="flex gap-2 mt-2 opacity-60 text-slate-400">
                            <span class="text-xs">💗 bea</span>
                            <span class="text-xs"># 🌐 🛠️</span>
                        </div>
                    </div>
                </div>

                <div class="text-center md:text-right interactive">
                    <p class="text-[10px] plex-mono text-zinc-600 uppercase tracking-widest mb-2">OBJECTIVE</p>
                    <p class="text-sm font-light text-slate-400 max-w-xs md:ml-auto leading-relaxed">
                        Create meaningful cinematic videos, with a touch of software.
                    </p>
                </div>
            </div>

            <div class="w-full mt-12 pt-10 border-t border-white/5 flex flex-col items-center md:flex-row md:justify-between interactive">
                <div class="p-5 glass-panel rounded-2xl max-w-xs mb-8 md:mb-0">
                    <p class="text-slate-600 plex-mono text-[9px] tracking-widest mb-3 uppercase">Status</p>
                    <p class="text-[11px] leading-relaxed text-zinc-500 font-light">
                        working on some on the side stuff :3
                    </p>
                </div>
                
                <div class="text-center md:text-right">
                    <p class="plex-mono text-zinc-600 uppercase tracking-widest mb-2 text-[9px]">PH TIME // GMT+8</p>
                    <div class="glass-panel p-4 px-6 rounded-2xl inline-flex items-center gap-4 border-blue-500/20">
                        <span class="w-2 h-2 bg-blue-400 rounded-full animate-pulse shadow-[0_0_15px_#60a5fa]"></span>
                        <span class="plex-mono text-3xl font-bold text-white tracking-tighter" id="gmt-time">12:00 AM</span>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        const radius = 4;
        const nodeCount = 50;
        const nodes = [];

        // 1. Earth Wireframe
        const sphereGeo = new THREE.SphereGeometry(radius, 40, 40);
        const sphereMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            wireframe: true,
            transparent: true,
            opacity: 0.03
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        globeGroup.add(sphere);

        // 2. Glowing Nodes
        const nodeGeo = new THREE.SphereGeometry(0.04, 12, 12);
        const nodeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        for (let i = 0; i < nodeCount; i++) {
            const node = new THREE.Mesh(nodeGeo, nodeMat);
            const phi = Math.acos(-1 + (2 * i) / nodeCount);
            const theta = Math.sqrt(nodeCount * Math.PI) * phi;
            node.position.setFromSphericalCoords(radius, phi, theta);
            globeGroup.add(node);
            nodes.push(node.position);
        }

        // 3. Link Lines
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
        const lineMaxDist = 2.5;

        for (let i = 0; i < nodeCount; i++) {
            for (let j = i + 1; j < nodeCount; j++) {
                const dist = nodes[i].distanceTo(nodes[j]);
                if (dist < lineMaxDist) {
                    const lineGeo = new THREE.BufferGeometry().setFromPoints([nodes[i], nodes[j]]);
                    const line = new THREE.Line(lineGeo, lineMat);
                    globeGroup.add(line);
                }
            }
        }

        camera.position.z = 9;

        // Mouse Logic
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            mouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Smooth Rotation based on mouse
            globeGroup.rotation.y += (mouseX * 0.4 - globeGroup.rotation.y) * 0.05;
            globeGroup.rotation.x += (mouseY * 0.4 - globeGroup.rotation.x) * 0.05;
            
            // Constant drift
            globeGroup.rotation.y += 0.001;

            renderer.render(scene, camera);
        }

        function updateGmtTime() {
            const now = new Date();
            const format = new Intl.DateTimeFormat('en-US', {
                hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Manila' 
            });
            document.getElementById('gmt-time').innerText = format.format(now);
        }
        setInterval(updateGmtTime, 1000);
        updateGmtTime();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
