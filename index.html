<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-video {
            /* Ensures the video fits your 1440p height without over-cropping */
            max-height: 100vh;
            max-width: 100vw;
            width: auto;
            height: auto;
            z-index: 1;
        }

        /* Large Top-Right Button */
        #mute-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
            
            /* Sizing */
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            
            /* Aesthetics */
            background: rgba(255, 255, 255, 0.8);
            color: black;
            border: none;
            cursor: pointer;
            font-family: 'Arial', sans-serif;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, background 0.2s;
        }
        
        #mute-btn:hover {
            background: #fff;
            transform: scale(1.1); /* Slightly grows when you hover */
        }

        #mute-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button id="mute-btn">🔊 UNMUTE ALL</button>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="https://bykopf.xyz/video.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('bg-video');
        const btn = document.getElementById('mute-btn');

        btn.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                btn.innerText = "🔇 MUTE";
                // Optional: Make button more subtle after unmuting
                btn.style.opacity = "0.6";
            } else {
                video.muted = true;
                btn.innerText = "🔊 UNMUTE ALL";
                btn.style.opacity = "1";
            }
        });
    </script>

</body>
</html>
