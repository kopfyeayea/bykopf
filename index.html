<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back - Maintenance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a; /* Deep black background */
            color: #e0e0e0; /* Light gray text for readability */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            background: #141414; /* Slightly lighter dark gray for the card */
            padding: 50px 40px;
            border-radius: 12px;
            border: 1px solid #222; /* Subtle border to define the container */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2rem;
            color: #ffffff; /* Crisp white for the heading */
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            font-size: 1.1rem;
            color: #a0a0a0; /* Muted gray for the description */
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .footer p {
            font-size: 0.9rem;
            color: #555555; /* Darker gray for the footer */
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Floating wrench icon -->
        <div class="icon">🛠️</div>
        
        <h1>Under Maintenance</h1>
        
        <p>We're currently updating our website to bring you a better experience. We look forward to welcoming you back shortly!</p>
        
        <div class="footer">
            <p>Thank you for your patience.</p>
        </div>
    </div>

</body>
</html>
