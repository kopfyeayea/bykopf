<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Six Rings — Player Impact Database</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #111114;
    --surface2: #18181d;
    --border: #222228;
    --accent: #e8b04b;
    --accent2: #c97c2e;
    --text: #e8e8ec;
    --muted: #666676;
    --low: #3a8a5c;
    --mid: #c97c2e;
    --high: #e84b4b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 32px 20px;
    display: flex;
    align-items: baseline;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,11,0.95);
    backdrop-filter: blur(8px);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    line-height: 1;
  }

  .logo span {
    color: var(--muted);
    font-size: 1rem;
    letter-spacing: 0.2em;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 400;
    margin-left: 4px;
    vertical-align: middle;
  }

  .count-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 3px 8px;
    letter-spacing: 0.1em;
    margin-left: auto;
    white-space: nowrap;
  }

  /* CONTROLS */
  .controls {
    padding: 20px 32px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-wrap::before {
    content: '⌕';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1.1rem;
    pointer-events: none;
  }

  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px 10px 34px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  .sort-group {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
  }

  .sort-btn {
    background: var(--bg);
    border: none;
    border-right: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .sort-btn:last-child { border-right: none; }
  .sort-btn:hover { background: var(--surface2); color: var(--text); }
  .sort-btn.active { background: var(--accent); color: #000; font-weight: 600; }

  .filter-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    white-space: nowrap;
    align-self: center;
  }

  /* GRID */
  .grid-wrap {
    padding: 24px 32px;
  }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1px;
    background: var(--border);
  }

  .player-card {
    background: var(--surface);
    padding: 18px 20px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .player-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--score-color, var(--muted));
    opacity: 0.7;
  }

  .player-card:hover {
    background: var(--surface2);
  }

  .player-card:hover::before {
    opacity: 1;
  }

  .card-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 10px;
    padding-right: 8px;
  }

  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.7rem;
    color: var(--score-color, var(--accent));
    line-height: 1;
    letter-spacing: 0.03em;
  }

  .card-seasons {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-align: right;
    line-height: 1.5;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 680px;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }

  .modal-header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 20px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }

  .modal-title {
    flex: 1;
  }

  .modal-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 0.06em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 6px;
  }

  .modal-peak {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.12em;
  }

  .modal-peak strong {
    color: var(--accent);
    font-size: 1.1rem;
  }

  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .modal-close:hover { border-color: var(--text); color: var(--text); }

  .modal-body {
    padding: 28px 32px;
  }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* Year table */
  .year-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 28px;
  }

  .year-table th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-align: left;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .year-table td {
    padding: 10px 0;
    border-bottom: 1px solid rgba(34,34,40,0.6);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
  }

  .year-table tr:last-child td {
    border-bottom: none;
  }

  .yr-year { color: var(--muted); width: 70px; }
  .yr-score { font-weight: 600; width: 80px; }
  .yr-bar { padding-right: 0; }

  .score-bar-wrap {
    height: 4px;
    background: var(--border);
    overflow: hidden;
    min-width: 80px;
  }

  .score-bar {
    height: 100%;
    transition: width 0.4s ease;
  }

  .yr-peak-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    background: var(--accent);
    color: #000;
    padding: 1px 5px;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* Score chart sparkline */
  .sparkline-wrap {
    margin-bottom: 8px;
  }

  .sparkline-svg {
    width: 100%;
    height: 80px;
    overflow: visible;
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    display: none;
  }

  .result-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    padding: 0 0 12px 0;
    letter-spacing: 0.08em;
  }
</style>
</head>

// Score coloring
function scoreColor(s) {
  if (s >= 8) return '#e84b4b';
  if (s >= 6) return '#e8934b';
  if (s >= 4) return '#e8b04b';
  if (s >= 2) return '#8ab84b';
  return '#4b7be8';
}

function scoreLabel(s) {
  if (s >= 8) return 'ELITE';
  if (s >= 6) return 'STAR';
  if (s >= 4) return 'IMPACT';
  if (s >= 2) return 'SOLID';
  return 'ROLE';
}

// Build sorted player list
let allPlayers = Object.entries(RAW).map(([name, data]) => ({
  name,
  maxScore: data.maxScore,
  years: data.years,
  scores: data.scores,
  seasons: data.years.length
}));

let currentSort = 'highest';
let searchTerm = '';

function getSorted(players, sort) {
  const arr = [...players];
  if (sort === 'highest') return arr.sort((a,b) => b.maxScore - a.maxScore);
  if (sort === 'lowest') return arr.sort((a,b) => a.maxScore - b.maxScore);
  if (sort === 'name') return arr.sort((a,b) => a.name.localeCompare(b.name));
  if (sort === 'seasons') return arr.sort((a,b) => b.seasons - a.seasons || b.maxScore - a.maxScore);
  return arr;
}

function getFiltered(players, term) {
  if (!term) return players;
  const t = term.toLowerCase();
  return players.filter(p => p.name.toLowerCase().includes(t));
}

function render() {
  const filtered = getFiltered(allPlayers, searchTerm);
  const sorted = getSorted(filtered, currentSort);
  
  const grid = document.getElementById('playerGrid');
  const noResults = document.getElementById('noResults');
  const countBadge = document.getElementById('countBadge');
  const resultCount = document.getElementById('resultCount');

  countBadge.textContent = `${allPlayers.length} PLAYERS`;
  resultCount.textContent = searchTerm ? `${sorted.length} of ${allPlayers.length} results` : `${sorted.length} players`;

  if (sorted.length === 0) {
    grid.innerHTML = '';
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';

  const maxScore = Math.max(...allPlayers.map(p => p.maxScore));

  grid.innerHTML = sorted.map(p => {
    const color = scoreColor(p.maxScore);
    const yearRange = p.years.length > 1 
      ? `${p.years[0]}–${p.years[p.years.length-1]}`
      : `${p.years[0]}`;
    return `
      <div class="player-card" style="--score-color:${color}" onclick="openModal('${p.name.replace(/'/g,"\\'")}')">
        <div class="card-name">${p.name}</div>
        <div class="card-bottom">
          <div class="card-score">${p.maxScore}</div>
          <div class="card-seasons">
            <div>${p.seasons} SEASON${p.seasons > 1 ? 'S' : ''}</div>
            <div>${yearRange}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function openModal(name) {
  const p = RAW[name];
  if (!p) return;
  
  const maxScore = Math.max(...p.scores);
  const maxIdx = p.scores.indexOf(maxScore);
  const color = scoreColor(maxScore);
  
  document.getElementById('modalName').textContent = name;
  document.getElementById('modalPeak').innerHTML = 
    `PEAK IMPACT: <strong style="color:${color}">${maxScore}</strong> &nbsp;·&nbsp; ${scoreLabel(maxScore)} &nbsp;·&nbsp; ${p.years.length} SEASON${p.years.length > 1 ? 'S' : ''}`;

  // Build sparkline
  let sparkSVG = '';
  if (p.years.length > 1) {
    const W = 600, H = 60;
    const minS = Math.min(...p.scores);
    const maxS = Math.max(...p.scores);
    const range = maxS - minS || 1;
    const pts = p.years.map((y, i) => {
      const x = (i / (p.years.length - 1)) * W;
      const y2 = H - ((p.scores[i] - minS) / range) * (H - 8) - 4;
      return `${x},${y2}`;
    });
    const peakPt = pts[maxIdx].split(',');
    sparkSVG = `
      <div class="section-label">IMPACT OVER TIME</div>
      <div class="sparkline-wrap">
        <svg class="sparkline-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
          ${p.years.map((y, i) => {
            const x = (i / (p.years.length - 1)) * W;
            const yc = H - ((p.scores[i] - minS) / range) * (H - 8) - 4;
            const isPeak = i === maxIdx;
            return `<circle cx="${x}" cy="${yc}" r="${isPeak ? 5 : 2.5}" fill="${isPeak ? color : 'rgba(255,255,255,0.3)'}" />`;
          }).join('')}
        </svg>
      </div>`;
  }

  // Build year table
  const tableRows = p.years.map((y, i) => {
    const s = p.scores[i];
    const isPeak = s === maxScore && i === maxIdx;
    const barPct = (s / maxScore) * 100;
    const barColor = scoreColor(s);
    return `
      <tr>
        <td class="yr-year">${y}</td>
        <td class="yr-score" style="color:${barColor}">${s}${isPeak ? '<span class="yr-peak-tag">PEAK</span>' : ''}</td>
        <td class="yr-bar">
          <div class="score-bar-wrap">
            <div class="score-bar" style="width:${barPct}%;background:${barColor}"></div>
          </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('modalBody').innerHTML = `
    ${sparkSVG}
    <div class="section-label" style="margin-top:${p.years.length > 1 ? '20px' : '0'}">YEARLY BREAKDOWN</div>
    <table class="year-table">
      <thead><tr>
        <th>YEAR</th><th>IMPACT</th><th></th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

// Event listeners
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

render();
</script>
